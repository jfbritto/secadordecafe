<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Roça Nossa: broto saindo da terra (paleta Lavoura Verde) -->
  <rect width="32" height="32" rx="7" fill="#1e5631"/>
  <!-- terra (faixa escura embaixo) -->
  <rect x="4" y="24" width="24" height="3" rx="1" fill="#0a2415"/>
  <!-- caule central -->
  <path d="M16 13v11" stroke="#fdfbf4" stroke-width="2" stroke-linecap="round"/>
  <!-- folha esquerda (gota) -->
  <path d="M16 18c-4-.5-6-3-6-7 4 .5 6 3 6 7z" fill="#fdfbf4"/>
  <!-- folha direita (gota) -->
  <path d="M16 14c3-.5 5-2.5 5-6-3 .5-5 2.5-5 6z" fill="#8db580"/>
</svg>
