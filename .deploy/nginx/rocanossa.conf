# Vhost Nginx do Roça Nossa
# Estilo alinhado com /etc/nginx/sites-available/treinaedu (mesmo VPS).
# Cole em /etc/nginx/sites-available/rocanossa e crie o symlink em sites-enabled/.
# O certbot adiciona o bloco SSL e o redirect 80→443 sozinho depois.

server {
    server_name rocanossa.com.br www.rocanossa.com.br;

    root /var/www/rocanossa/public;
    index index.php;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen 80;
}
