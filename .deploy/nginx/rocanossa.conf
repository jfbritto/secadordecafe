# Vhost Nginx do Roça Nossa
# Cole em /etc/nginx/sites-available/rocanossa
# Depois: sudo ln -s /etc/nginx/sites-available/rocanossa /etc/nginx/sites-enabled/
# E:     sudo nginx -t && sudo systemctl reload nginx
#
# Antes do certbot rodar, este vhost responde só em :80 servindo o app.
# Depois do certbot, ele substitui este arquivo adicionando o bloco SSL automaticamente.

server {
    listen 80;
    listen [::]:80;
    server_name rocanossa.com.br www.rocanossa.com.br;

    root /var/www/rocanossa/public;
    index index.php;

    charset utf-8;

    # Tamanho máximo de upload (PDFs, etc.)
    client_max_body_size 20M;

    # Logs separados pra facilitar debug
    access_log /var/log/nginx/rocanossa.access.log;
    error_log  /var/log/nginx/rocanossa.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache forte pra assets versionados do Vite
    location ~* ^/build/.*\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
