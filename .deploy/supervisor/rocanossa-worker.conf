; Supervisor: worker da fila Redis do Roça Nossa
; Estilo alinhado com /etc/supervisor/conf.d/treinaedu-worker.conf (mesmo VPS).
; Cole em /etc/supervisor/conf.d/rocanossa-worker.conf
; Depois:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start rocanossa-worker:*
;
; O deploy.sh reinicia este grupo a cada release (sudo supervisorctl restart rocanossa-worker:*).

[program:rocanossa-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/rocanossa/artisan queue:work redis --queue=emails,default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/rocanossa/storage/logs/worker.log
stopwaitsecs=3600
