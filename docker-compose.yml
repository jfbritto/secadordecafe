services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: secadordecafe_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started
    networks:
      - secadordecafe

  web:
    image: nginx:1.27-alpine
    container_name: secadordecafe_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - secadordecafe

  mysql:
    image: mysql:8.4
    container_name: secadordecafe_mysql
    command: ["--mysql-native-password=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: secadordecafe
      MYSQL_USER: secadordecafe
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - secadordecafe

  redis:
    image: redis:7-alpine
    container_name: secadordecafe_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - secadordecafe

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: secadordecafe_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - secadordecafe

  node:
    image: node:22-alpine
    container_name: secadordecafe_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    command: ["sh", "-c", "tail -f /dev/null"]
    networks:
      - secadordecafe

volumes:
  mysql_data:
  redis_data:

networks:
  secadordecafe:
    driver: bridge
