# /etc/nginx/sites-available/secadordecafe
# Substitua APP_DOMAIN abaixo. Após copiar:
#   ln -sf /etc/nginx/sites-available/secadordecafe /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d APP_DOMAIN
#
# Após o certbot configurar SSL, ele atualiza automaticamente este arquivo.

server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN;

    root /var/www/secadordecafe/current/public;
    index index.php;

    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Bloqueia dotfiles exceto .well-known (Let's Encrypt)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache estático
    location ~* \.(?:css|js|map|jpe?g|gif|png|svg|ico|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    access_log /var/log/nginx/secadordecafe.access.log;
    error_log  /var/log/nginx/secadordecafe.error.log warn;
}
